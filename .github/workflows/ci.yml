name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_dev_password
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Privileged: owns the schema, runs migrations, bypasses RLS.
      DATABASE_URL: postgresql://platform:platform_dev_password@localhost:5432/platform_test?schema=public
      # Unprivileged: what the application uses, and what the isolation suite
      # asserts against. Without this the suite would run as a superuser and
      # pass while proving nothing. The role is created by the
      # enable_row_level_security migration.
      DATABASE_URL_APP: postgresql://platform_app:platform_app_dev_password@localhost:5432/platform_test?schema=public
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Fails on AGPL, SSPL, GPL, BUSL and undeclared licences. AGPL is the
      # one that genuinely matters for SaaS: its obligations trigger on
      # network use, not distribution, so a single transitive package could
      # create an obligation to publish this entire codebase.
      - name: Licence check
        run: pnpm licenses:check

      # Known-vulnerable dependencies fail the build. Accepted advisories are
      # listed with a reason in package.json under pnpm.auditConfig, so an
      # exception is a reviewed decision rather than a warning nobody reads.
      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level high

      - name: Unit tests
        run: pnpm test

      # Runs against the real PostgreSQL service above, and includes the
      # tenant-isolation suite. That suite protects the central promise of the
      # product and must never be allowed to fail or be skipped.
      - name: End-to-end tests (includes tenant isolation)
        run: pnpm test:e2e
